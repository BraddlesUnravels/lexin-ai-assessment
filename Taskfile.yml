version: '3'

tasks:
  ci:
    desc: 'Run CI (developer: Node 24/npm and Go Task; app startup: Docker CLI and Compose only)'
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: test:unit
      - task: build
      - task: compose:check
      - task: container:smoke

  format:check:
    desc: Check repository formatting without rewriting files
    cmds:
      - npm run format:check

  lint:
    desc: Run the repository ESLint check
    cmds:
      - npm run lint

  typecheck:
    desc: Check API and UI TypeScript projects
    cmds:
      - npm run typecheck:api
      - npm run typecheck:ui

  build:
    desc: Build the API and UI
    cmds:
      - npm run build:api
      - npm run build:ui

  compose:check:
    desc: Validate the merged Docker Compose configuration
    cmds:
      - ./scripts/compose.sh config --quiet

  container:smoke:
    desc: Build an isolated Compose stack and verify the scaffold through its UI proxy
    cmds:
      - ./scripts/container-smoke.sh

  test:unit:
    desc: Run currently available risk-based unit tests
    cmds:
      - npm run test:unit
